apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.db.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.db.name }}
    group: {{ .Values.db.group }}
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3
  instances: {{ .Values.db.instances }}
  storage:
    size: {{ .Values.db.size }}
  resources:
    limits:
      cpu: {{ .Values.db.resource.limits.cpu | quote }}
      memory: {{ .Values.db.resource.limits.memory }}

  {{- if .Values.db.backups }}
  backup:
    {{- if .Values.db.backups.volumeSnapshot }}
    volumeSnapshot:
      className: {{ .Values.db.backups.volumeSnapshot.snapshotClassName }}
    {{- end }}

    # Keep 4 weekly backups
    retentionPolicy: "4w"

    {{- if .Values.db.backups.s3.enabled }}
    barmanObjectStore:
      wal:
        compression: bzip2
      data:
        compression: bzip2
      destinationPath: {{ .Values.db.backups.s3.destinationPath }}
      endpointURL: {{ .Values.db.backups.s3.endpointURL }}
      s3Credentials:
          accessKeyId:
            name: {{ .Values.db.backups.s3.secretName }}
            key: access_key
          secretAccessKey:
            name: {{ .Values.db.backups.s3.secretName }}
            key: secret_key
    {{- end }}
  {{- end }}

  # Add TLS certificates for encrypted communication
  certificates:
    serverTLSSecret: {{ .Values.db.name }}-server-cert
    serverCASecret: {{ .Values.db.name }}-server-cert

  # Enable superuser access
  enableSuperuserAccess: true

  # Configure postgres superuser from su_external_secret
  superuserSecret:
    name: "{{ .Values.db.name }}-superuser"

  bootstrap:
    initdb:
      database: {{ .Values.db.app.name }}
      owner: {{ .Values.db.app.owner }}
      secret:
        name: "{{ .Values.db.name }}-app-user"

  postgresql:
    # Preload pg_stat_statements for cumulative per-query-shape cost stats —
    # the fs_scans slow-path recursive directory/owner scans are the target,
    # and without this we have no way to rank query shapes by total time.
    # Adding a library to shared_preload_libraries requires a restart; CNPG
    # performs a controlled rolling restart (replicas first, then switchover),
    # so downtime is near-zero. The extension must additionally be created once
    # per database (not auto-created on an existing cluster):
    #   CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
    shared_preload_libraries:
      - pg_stat_statements
    parameters:
      # Connection settings
      # max_connections raised 200 → 300 to absorb the fs_scans interactive
      # read load: the SAM webapp opens ONE engine per filesystem-scan
      # collection per pod (~13 collections), each a SQLAlchemy QueuePool that
      # can reach 5+10 connections under concurrency. Pools self-relieve when
      # idle (server idle_session_timeout reaps them), but a multi-pod burst
      # plus the resource-mode explorer fanning across all collections can spike
      # well past 200. At the 64Gi limit and ~10 MiB per backend slot the extra
      # 100 slots cost ~1Gi, well within budget.
      max_connections: "300"
      # Query statistics (pg_stat_statements; library preloaded above). Track
      # the top normalized statements so the fs_scans slow-path scans surface in
      # cost rankings.
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: "top"
      # Disconnect idle client sessions after 10 minutes. Postgres 14+
      # feature. SQLAlchemy clients with `pool_pre_ping=True` detect the
      # closed socket on next checkout and transparently open a fresh
      # connection — so this is the server-side counterpart to client-side
      # pool_recycle, and it works even when clients never check out a
      # pooled connection again (which is how idle pool_size connections
      # accumulate indefinitely otherwise). Value is milliseconds.
      idle_session_timeout: "600000"
      # Also abort transactions left idle for >10 min — protects against
      # client crashes / hung sessions that hold locks.
      idle_in_transaction_session_timeout: "600000"

      # SSL Configuration
      ssl_ciphers: "HIGH:!aNULL"
      ssl_min_protocol_version: "TLSv1.3"

      # Memory settings
      shared_buffers: "32GB"
      temp_buffers: "64MB"
      # work_mem raised 32MB → 64MB. The fs_scans slow path aggregates over
      # directory_stats (tens of millions of rows per collection) and spills
      # large sorts/hashes to temp files (observed ~250GB cumulative on the
      # campaign DB). 64MB halves the spill pressure on those queries while
      # staying safe: peak observed concurrency is low (1–2 active scans) and
      # memory sits at ~37/64Gi, so even a worst-case sort-node multiplier
      # leaves comfortable headroom. Revisit if active concurrency climbs.
      work_mem: "64MB"
      maintenance_work_mem: "128MB"
      dynamic_shared_memory_type: "posix"

      # Resource limits
      max_files_per_process: "2000"

      # WAL settings
      wal_level: "replica"
      checkpoint_timeout: "15min"
      checkpoint_completion_target: "0.9"
      max_wal_size: "20GB"
      min_wal_size: "1GB"

      # Replication settings
      max_wal_senders: "6"
      max_replication_slots: "6"
      wal_keep_size: "1024MB"
      max_slot_wal_keep_size: "100GB"
      max_standby_archive_delay: "-1"
      max_standby_streaming_delay: "-1"

      # Logging settings
      logging_collector: "on"
      log_rotation_age: "0"
      # log_min_duration_statement lowered 120000 → 2000 (ms). The fs_scans
      # slow-path scans run 10–40s under interactive load — far slower than any
      # acceptable page load, yet invisible at the old 120s threshold. Logging
      # everything ≥2s surfaces them without drowning the log in fast-path
      # histogram reads (which return in <100ms).
      log_min_duration_statement: "2000"
      log_line_prefix: "%t %a [%p] "
      log_timezone: "America/Denver"

      # Locale and timezone settings
      datestyle: "iso, mdy"
      timezone: "America/Denver"
      lc_messages: "en_US.UTF-8"
      lc_monetary: "en_US.UTF-8"
      lc_numeric: "en_US.UTF-8"
      lc_time: "en_US.UTF-8"
      default_text_search_config: "pg_catalog.english"

      # Lock management
      max_locks_per_transaction: "1024"

    pg_hba:
      ## Local connections with md5 authentication
      #- local all root md5
      #- local all all md5
      #
      ## IPv4 local connections with md5
      #- host all all 127.0.0.1/32 md5
      #
      ## IPv6 local connections with md5
      #- host all all ::1/128 md5
      #
      ## IPv4 remote connections for UCAR network
      #- host all all 128.117.0.0/16 md5
      #
      ## Replication connections
      #- local replication all md5
      #- host replication all 127.0.0.1/32 md5
      #
      ## Remote replication
      #- host replication all 128.117.0.0/16 trust
      #
      ## Remote replication from Kubernetes pod network
      #- host replication all 10.0.0.0/16 trust

      - "host all all 0.0.0.0/0 md5"
