name: Automatically Remove old GitHub Action logs (cron)

on:
  workflow_dispatch:
  schedule:
    # run at 3:43 UTC 11th of each month
    # ref: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#onschedule
    - cron: '43 3 11 * *'

jobs:
  delete-old-actions:
    permissions:
      actions: write
    uses: ./.github/workflows/_prune-workflow-runs.yaml
    with:
      days-ago: '60'
      dry-run: false
